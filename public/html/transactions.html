<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Duit — Kelola dan catat semua transaksi keuangan Anda.">
  <title>Transactions — My Duit</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-950 text-white min-h-screen">

  <!-- ===== TOP NAV ===== -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/html/index.html" class="flex items-center gap-2 font-bold text-lg tracking-tight">
        <span class="text-2xl">💰</span>
        <span class="text-white">My <span class="text-emerald-400">Duit</span></span>
      </a>

      <!-- Desktop nav -->
      <nav class="hidden md:flex items-center gap-1">
        <a href="/html/index.html"        class="nav-link px-3 py-1.5 text-sm text-slate-300 hover:text-white rounded-md">🏠 Dashboard</a>
        <a href="/html/transactions.html" class="nav-link px-3 py-1.5 text-sm text-slate-300 hover:text-white rounded-md">💸 Transactions</a>
        <a href="/html/categories.html"   class="nav-link px-3 py-1.5 text-sm text-slate-300 hover:text-white rounded-md">🗂️ Categories</a>
        <a href="/html/reports.html"      class="nav-link px-3 py-1.5 text-sm text-slate-300 hover:text-white rounded-md">📊 Reports</a>
      </nav>

      <!-- Hamburger button (mobile only) -->
      <button id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false"
              class="md:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg id="nav-icon-open" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg id="nav-icon-close" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Mobile dropdown menu -->
    <div id="nav-mobile-menu"
         class="hidden md:hidden opacity-0 -translate-y-2 transition-all duration-200
                bg-slate-900 border-t border-slate-800 px-4 py-3 flex flex-col gap-1">
      <a href="/html/index.html"        class="nav-link block px-3 py-2.5 text-sm text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg">🏠 Dashboard</a>
      <a href="/html/transactions.html" class="nav-link block px-3 py-2.5 text-sm text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg">💸 Transactions</a>
      <a href="/html/categories.html"   class="nav-link block px-3 py-2.5 text-sm text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg">🗂️ Categories</a>
      <a href="/html/reports.html"      class="nav-link block px-3 py-2.5 text-sm text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg">📊 Reports</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">

    <!-- Page heading -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold">Transactions</h1>
      <p class="text-slate-400 mt-1 text-sm">Catat pemasukan dan pengeluaran Anda</p>
    </div>

    <!-- Feedback bar -->
    <div id="txn-feedback" class="status-bar mb-5"></div>

    <!-- Add Transaction form -->
    <section class="bg-slate-900 rounded-xl border border-slate-800 p-6 mb-8">
      <h2 class="font-semibold text-base mb-4">➕ Tambah Transaksi</h2>
      <form id="transaction-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- Category -->
        <div class="flex flex-col gap-1">
          <label class="text-xs text-slate-400 font-medium">Kategori <span class="text-red-400">*</span></label>
          <select id="txn-category" class="p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500"></select>
        </div>

        <!-- Amount -->
        <div class="flex flex-col gap-1">
          <label class="text-xs text-slate-400 font-medium">
            Jumlah <span class="text-red-400">*</span>
            <span class="ml-1 text-slate-500">(boleh ekspresi: 50000+15000)</span>
          </label>
          <input id="txn-amount"
                 type="text"
                 placeholder="Contoh: 75000 atau 50000+25000"
                 class="p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500 font-mono" />
        </div>

        <!-- Date -->
        <div class="flex flex-col gap-1">
          <label class="text-xs text-slate-400 font-medium">Tanggal <span class="text-red-400">*</span></label>
          <input id="txn-date" type="date"
                 class="p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500" />
        </div>

        <!-- Description -->
        <div class="flex flex-col gap-1">
          <label class="text-xs text-slate-400 font-medium">Keterangan</label>
          <input id="txn-desc" type="text" placeholder="Opsional"
                 class="p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-emerald-500" />
        </div>

        <!-- Submit -->
        <div class="md:col-span-2 flex justify-end">
          <button id="txn-submit"
                  class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-semibold transition-colors">
            Simpan Transaksi
          </button>
        </div>
      </form>
    </section>

    <!-- Transactions list -->
    <section class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
        <h2 class="font-semibold text-base">Daftar Transaksi</h2>
        <div class="flex gap-2">
          <button id="btn-export-csv"
                  class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs text-slate-300 transition-colors">
            ⬇ Export CSV
          </button>
          <button id="btn-print-preview"
                  class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs text-slate-300 transition-colors">
            🖨️ Print
          </button>
        </div>
      </div>
      <div id="transactions-container" class="p-6 text-sm text-slate-400">Loading...</div>
    </section>

  </main>

  <script src="/js/api-client.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/transactions.js"></script>
</body>
</html>
