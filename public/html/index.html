<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 Personal Finance Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800">
  <div class="min-h-screen">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-700">
      <div class="max-w-7xl mx-auto px-4 py-6">
        <h1 class="text-3xl font-bold text-white">
          💰 Personal Finance Dashboard
        </h1>
        <p class="text-slate-400 mt-2">Manage your money, track your future</p>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12">
      <!-- Status Section -->
      <div id="app-status" class="mb-8">
        <div class="bg-blue-500/20 border border-blue-500 rounded-lg p-4">
          <p class="text-blue-300">
            ⏳ Initializing application...
          </p>
        </div>
      </div>

      <!-- Dashboard Grid (akan diisi oleh JavaScript) -->
      <div id="dashboard" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
        <!-- Dashboard cards akan di-render di sini -->
      </div>

      <!-- Transactions Table (akan diisi oleh JavaScript) -->
      <div id="transactions-section" class="bg-slate-800 rounded-lg border border-slate-700 p-6">
        <h2 class="text-2xl font-bold text-white mb-6">Recent Transactions</h2>
        <div id="transactions-table">
          <p class="text-slate-400">Loading transactions...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- JavaScript -->
  <script src="/js/api-client.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
