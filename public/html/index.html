<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="My Duit — Personal Finance Dashboard. Pantau income, expense, dan saldo keuangan Anda secara real-time."
    />
    <title>Dashboard — My Duit</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="bg-slate-950 text-white min-h-screen">
    <!-- ===== TOP NAV ===== -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between"
      >
        <a
          href="/html/index.html"
          class="flex items-center gap-2 font-bold text-lg tracking-tight"
        >
          <span class="text-2xl">💰</span>
          <span class="text-white"
            >My <span class="text-emerald-400">Duit</span></span
          >
        </a>

        <!-- Desktop nav -->
        <nav class="hidden md:flex items-center gap-1">
          <a
            href="/html/index.html"
            class="nav-link px-3 py-1.5 text-sm text-slate-300 hover:text-white rounded-md"
            >🏠 Dashboard</a
          >
          <a
            href="/html/transactions.html"
            class="nav-link px-3 py-1.5 text-sm text-slate-300 hover:text-white rounded-md"
            >💸 Transactions</a
          >
          <a
            href="/html/categories.html"
            class="nav-link px-3 py-1.5 text-sm text-slate-300 hover:text-white rounded-md"
            >🗂️ Categories</a
          >
          <a
            href="/html/reports.html"
            class="nav-link px-3 py-1.5 text-sm text-slate-300 hover:text-white rounded-md"
            >📊 Reports</a
          >
          <!-- Auth buttons -->
          <a
            href="/html/login.html"
            id="nav-login"
            class="nav-auth px-3 py-1.5 text-sm text-slate-300 hover:text-white rounded-md"
            >🔑 Login</a
          >
          <button
            id="nav-logout"
            class="nav-auth hidden px-3 py-1.5 text-sm text-red-400 hover:text-red-300 rounded-md cursor-pointer"
          >
            🚪 Logout
          </button>
        </nav>

        <!-- Hamburger button (mobile only) -->
        <button
          id="nav-hamburger"
          aria-label="Toggle menu"
          aria-expanded="false"
          class="md:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
        >
          <!-- 3 garis -->
          <svg
            id="nav-icon-open"
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <!-- X -->
          <svg
            id="nav-icon-close"
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6 hidden"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <!-- Mobile dropdown menu -->
      <div
        id="nav-mobile-menu"
        class="hidden md:hidden opacity-0 -translate-y-2 transition-all duration-200 bg-slate-900 border-t border-slate-800 px-4 py-3 flex flex-col gap-1"
      >
        <a
          href="/html/index.html"
          class="nav-link block px-3 py-2.5 text-sm text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg"
          >🏠 Dashboard</a
        >
        <a
          href="/html/transactions.html"
          class="nav-link block px-3 py-2.5 text-sm text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg"
          >💸 Transactions</a
        >
        <a
          href="/html/categories.html"
          class="nav-link block px-3 py-2.5 text-sm text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg"
          >🗂️ Categories</a
        >
        <a
          href="/html/reports.html"
          class="nav-link block px-3 py-2.5 text-sm text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg"
          >📊 Reports</a
        >
        <!-- Auth buttons mobile -->
        <a
          href="/html/login.html"
          id="nav-login-mobile"
          class="nav-auth block px-3 py-2.5 text-sm text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg"
          >🔑 Login</a
        >
        <button
          id="nav-logout-mobile"
          class="nav-auth hidden block px-3 py-2.5 text-sm text-red-400 hover:text-red-300 hover:bg-slate-800 rounded-lg w-full text-left cursor-pointer"
        >
          🚪 Logout
        </button>
      </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="max-w-7xl mx-auto px-6 py-10">
      <!-- Status bar -->
      <div id="app-status" class="status-bar mb-6"></div>

      <!-- Page heading -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold">Dashboard</h1>
        <p class="text-slate-400 mt-1 text-sm">
          Ringkasan keuangan Anda hari ini
        </p>
      </div>

      <!-- Summary cards -->
      <div
        id="dashboard"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-10"
      >
        <!-- Rendered by dashboard.js -->
        <div class="skeleton h-32 col-span-1"></div>
        <div class="skeleton h-32 col-span-1"></div>
        <div class="skeleton h-32 col-span-1"></div>
        <div class="skeleton h-32 col-span-1"></div>
      </div>

      <!-- Recent Transactions -->
      <section
        class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden"
      >
        <div
          class="px-6 py-4 border-b border-slate-800 flex items-center justify-between"
        >
          <h2 class="font-semibold text-base">Riwayat Transaksi Terkini</h2>
          <a
            href="/html/transactions.html"
            class="text-xs text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-1"
          >
            Lihat semua →
          </a>
        </div>
        <div id="transactions-table" class="p-6">
          <div class="skeleton h-8 mb-2 w-full rounded"></div>
          <div class="skeleton h-8 mb-2 w-full rounded"></div>
          <div class="skeleton h-8 w-3/4 rounded"></div>
        </div>
      </section>
    </main>

    <script src="/js/api-client.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
