<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Preview - My Duit</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }
    
    h1 {
      margin: 0;
      font-size: 24px;
    }
    
    .date-stamp {
      font-size: 14px;
      color: #666;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }
    
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }
    
    th {
      background-color: #f5f5f5;
      font-weight: bold;
    }
    
    .text-right {
      text-align: right;
    }
    
    .text-center {
      text-align: center;
    }

    .status-msg {
      text-align: center;
      padding: 40px;
      color: #666;
      font-style: italic;
    }
    
    .no-print {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .btn {
      padding: 8px 16px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .btn-secondary {
      background: #666;
    }
    
    @media print {
      .no-print {
        display: none;
      }
      body {
        padding: 0;
      }
      @page {
        margin: 1.5cm;
      }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <button class="btn" onclick="window.print()">Print Document</button>
    <button class="btn btn-secondary" onclick="window.close()">Close Preview</button>
  </div>

  <div class="header">
    <h1 id="doc-title">Document Preview</h1>
    <div class="date-stamp" id="doc-date"></div>
  </div>

  <div id="content">
    <div class="status-msg">Loading data...</div>
  </div>

  <script src="/js/api-client.js"></script>
  <script src="/js/print.js"></script>
</body>
</html>
