<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="My Duit — Buat akun baru."
    />
    <title>Register — My Duit</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="bg-slate-950 text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-6">
      <!-- Logo -->
      <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center gap-2 font-bold text-2xl tracking-tight">
          <span class="text-3xl">💰</span>
          <span class="text-white">My <span class="text-emerald-400">Duit</span></span>
        </a>
        <p class="text-slate-400 mt-2 text-sm">Buat akun baru</p>
      </div>

      <!-- Register card -->
      <div class="bg-slate-900 rounded-xl border border-slate-800 p-8">
        <form id="register-form">
          <div class="mb-5">
            <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="nama@email.com"
              required
              class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
            />
          </div>

          <div class="mb-5">
            <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Buat password"
              required
              minlength="6"
              class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
            />
          </div>

          <div class="mb-6">
            <label for="confirm-password" class="block text-sm font-medium text-slate-300 mb-1.5">Konfirmasi Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Ulangi password"
              required
              class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
            />
          </div>

          <div id="register-error" class="mb-4 text-red-400 text-sm hidden"></div>

          <button
            type="submit"
            id="register-btn"
            class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg transition cursor-pointer"
          >
            Daftar
          </button>
        </form>

        <p class="mt-5 text-center text-sm text-slate-400">
          Sudah punya akun?
          <a href="/html/login.html" class="text-emerald-400 hover:text-emerald-300 font-medium">Masuk</a>
        </p>
      </div>
    </div>

    <script src="/js/api-client.js"></script>
    <script src="/js/register.js"></script>
  </body>
</html>
